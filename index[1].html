function isoDate(date){const d=new Date(date);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function shiftDate(days){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return isoDate(d);}
function addDays(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return isoDate(d);}
function dateDisplay(date){return new Date(date+'T12:00:00').toLocaleDateString(lang==='kk'?'kk-KZ':'en-GB',{day:'numeric',month:'short',year:'numeric'});}
function samplePond(id,name,species,count,area,start,step,oxygenBase,tempBase,phBase){
  const logs=Array.from({length:15},(_,i)=>{
    const day=i-14;
    const varied=Math.sin(i*.87+id.length)*.29;
    return {date:shiftDate(day),weight:Math.round((start+i*step+Math.sin(i*1.1)*2)*10)/10,oxygen:Math.round((oxygenBase+varied+(i%5===0?.1:0))*10)/10,temp:Math.round((tempBase+Math.sin(i*.65)*1.4)*10)/10,ph:Math.round((phBase+Math.cos(i*.55)*.2)*10)/10};
  });
  return {id,name,species,count,area,logs};
}

function latest(p){return [...p.logs].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;}
function weight(p){return latest(p)?.weight||0;}
function biomass(p){return p.count*weight(p)/1000;}
function assess(p,log=latest(p)){
  if(!log)return {grade:'neutral',notes:[t('waterNotAvailable')]};
  const notes=[];
  if(log.oxygen<5)notes.push(t('oxygenLow'));
  if(log.ph<6.5||log.ph>8.5)notes.push(t('phIssue'));
  const [min,max]=(SPECIES[p.species]||SPECIES.carp).temp;
  if(log.temp<min||log.temp>max)notes.push(t('tempIssue'));
  return {grade:notes.length?'warn':'good',notes};
}
function regression(p){
  const logs=[...p.logs].sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  if(logs.length<2)return 0;
  const first=new Date(logs[0].date+'T12:00:00').getTime();
  const xs=logs.map(l=>(new Date(l.date+'T12:00:00').getTime()-first)/86400000);
  const ys=logs.map(l=>Number(l.weight));
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=ys.reduce((a,b)=>a+b,0)/ys.length;
  const den=xs.reduce((s,x)=>s+(x-mx)**2,0);
  return den?xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/den:0;
}
function overall(){return {fish:state.ponds.reduce((a,p)=>a+p.count,0),bio:state.ponds.reduce((a,p)=>a+biomass(p),0),alerts:state.ponds.reduce((a,p)=>a+assess(p).notes.length,0)}}

function lineSVG(logs,field,id,color='#3ee0ba'){
  if(!logs.length)return `<div class="empty">${t('notEnough')}</div>`;
  const values=logs.map(l=>Number(l[field])).filter(Number.isFinite);
  const minVal=Math.min(...values),maxVal=Math.max(...values);
  const span=Math.max(1,maxVal-minVal),low=minVal-span*.32,high=maxVal+span*.32;
  const W=620,H=228,L=48,R=10,T=16,B=24,plotW=W-L-R,plotH=H-T-B;
  const x=i=>L+(logs.length===1?plotW/2:i*plotW/(logs.length-1));
  const y=v=>T+(high-v)/(high-low)*plotH;
  const points=logs.map((l,i)=>`${x(i).toFixed(1)},${y(l[field]).toFixed(1)}`).join(' ');
  const area=`${L},${H-B} ${points} ${x(logs.length-1)},${H-B}`;
  const grid=Array.from({length:5},(_,i)=>{const yy=T+i*plotH/4;const val=high-i*(high-low)/4;return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#305062" stroke-dasharray="4 6" opacity=".75"/><text x="${L-9}" y="${yy+4}" text-anchor="end" fill="#84A8B8" font-size="11">${nf(val,field==='weight'?0:1)}</text>`}).join('');
  const dots=logs.map((l,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(l[field]).toFixed(1)}" r="3" fill="${color}" stroke="#143044" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Trend line chart"><defs><linearGradient id="fill-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".24"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<polygon points="${area}" fill="url(#fill-${id})"/><polyline points="${points}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function axisDates(logs){return `<div class="chart-labels"><span>${logs.length?dateDisplay(logs[0].date):''}</span><span>${logs.length?dateDisplay(logs[Math.floor((logs.length-1)/2)].date):''}</span><span>${logs.length?dateDisplay(logs[logs.length-1].date):''}</span></div>`;}
function pondOptions(selected=selectedPond){return state.ponds.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)}</option>`).join('');}
function pondCard(p){const w=weight(p),b=biomass(p),target=SPECIES[p.species]?.target||900;const progress=Math.min(100,Math.round(w/target*100));return `<article class="pond-card"><div class="pond-card-head"><div class="pond-avatar">${SPECIES[p.species]?.icon||'🐟'}</div>${badge(p)}</div><h3 class="pond-title">${esc(p.name)}</h3><div class="pond-meta">${esc(SPECIES[p.species]?.[lang]||p.species)} · ${nf(p.count)} ${t('fish')}</div><div class="pond-data"><div><label>${t('weight')}</label><strong>${nf(w,1)} g</strong></div><div><label>${t('biomass')}</label><strong>${nf(b/1000,2)} t</strong></div><div><label>${t('oxygen')}</label><strong>${nf(latest(p)?.oxygen||0,1)} mg/L</strong></div><div><label>${t('temp')}</label><strong>${nf(latest(p)?.temp||0,1)} °C</strong></div></div><div class="progress-info"><span>${t('targetProgress')}</span><span>${progress}%</span></div><div class="progress-track"><span style="width:${progress}%"></span></div><div class="pond-footer"><span class="small-muted">${t('updated')}: ${dateDisplay(latest(p).date)}</span><button class="plain-link" data-action="openPond" data-id="${esc(p.id)}">${t('details')} →</button></div></article>`;}
function renderOverview(){const all=overall(),p=state.ponds.find(x=>x.id===selectedPond)||state.ponds[0];selectedPond=p.id;
  const days=[...p.logs].sort((a,b)=>a.date.localeCompare(b.date)).slice(-14);
  const stat=(title,value,desc,icon,kind='')=>`<article class="stat"><div class="stat-head"><span>${title}</span><span class="stat-icon ${kind}">${icon}</span></div><div class="stat-val">${value}</div><div class="stat-desc">${desc}</div></article>`;
  const alerts=state.ponds.map(p=>({p,s:assess(p)})).filter(x=>x.s.notes.length);
  return `${header('overviewTitle','overviewSub',`${buttonExport()}<button class="btn primary" data-action="addLog">${t('newLog')}</button>`)}
  <section class="hero"><div class="hero-copy"><div class="hero-label">${t('heroTag')}</div><h2>${t('heroTitle')}</h2><p>${t('heroDesc')}</p><button class="btn primary" data-view="project">${t('heroButton')} ↗</button></div><div class="hero-graphic">${heroFish()}</div></section>
  <section class="stat-grid">${stat(t('totalFish'),nf(all.fish),t('demoStock'),'♧')}${stat(t('estimatedBiomass'),`${nf(all.bio/1000,2)} t`,t('estimated'),'◈','blue')}${stat(t('dailyFeed'),`${nf(all.bio*.02,1)} kg`,t('feedRate'),'▤','gold')}${stat(t('activeAlerts'),nf(all.alerts),t('waterThreshold'),'!','rose')}</section>
  <div class="main-grid"><article class="panel"><div class="panel-head"><div><h2 class="panel-title">${t('growthTitle')}</h2><div class="panel-sub">${t('growthSub')}</div></div><select class="field-select" data-control="pond">${pondOptions()}</select></div><div class="chart-box">${lineSVG(days,'weight','overview','#42e4be')}</div>${axisDates(days)}<div class="chart-bottom"><span class="legend">${t('avgWeight')}</span><span class="pill neutral">${t('last14')}</span></div></article><article class="panel"><div class="panel-head"><div><h2 class="panel-title">${t('waterAlerts')}</h2><div class="panel-sub">${t('alertsSub')}</div></div><span class="pill ${alerts.length?'warn':''}">${alerts.length?nf(all.alerts)+' !':'✓ OK'}</span></div><div class="alert-list">${alerts.length?alerts.map(({p,s})=>s.notes.map(n=>`<div class="alert"><div class="alert-dot warn"></div><div><strong>${esc(p.name)}</strong><span>${esc(n)}</span></div></div>`).join('')).join(''):`<div class="alert"><div class="alert-dot"></div><div><strong>${t('allClear')}</strong><span>${t('safe')}</span></div></div>`}${state.ponds.filter(p=>!assess(p).notes.length).slice(0,2).map(p=>`<div class="alert"><div class="alert-dot"></div><div><strong>${esc(p.name)}</strong><span>${t('safe')}</span></div></div>`).join('')}</div><div class="info-box">${t('limitation')}</div></article></div>
  <div class="section-top"><h2>${t('pondOverview')}</h2><button class="plain-link" data-view="ponds">${t('allPonds')} →</button></div><div class="pond-grid">${state.ponds.map(pondCard).join('')}</div>`;
}
function renderPonds(){return `${header('pondsTitle','pondsSub',`${buttonExport()}<button class="btn primary" data-action="addPond">${t('addPond')}</button>`)}<div class="table-wrap"><table><thead><tr><th>${t('pond')}</th><th>${t('species')}</th><th>${t('count')}</th><th>${t('weight')}</th><th>${t('temp')}</th><th>${t('oxygen')}</th><th>${t('status')}</th><th>${t('action')}</th></tr></thead><tbody>${state.ponds.map(p=>`<tr><td><div class="table-name">${esc(p.name)}</div><div class="small-muted">${nf(p.area)} m²</div></td><td>${esc(SPECIES[p.species]?.[lang]||p.species)}</td><td>${nf(p.count)}</td><td>${nf(weight(p),1)} g</td><td>${nf(latest(p)?.temp,1)} °C</td><td>${nf(latest(p)?.oxygen,1)} mg/L</td><td>${badge(p)}</td><td><button class="btn small ghost" data-action="addLog" data-id="${esc(p.id)}">+ ${t('update')}</button></td></tr>`).join('')}</tbody></table></div><div class="status-key"><span>${t('waterGood')}</span><span class="warn">${t('waterWarn')}</span></div><div class="section-top" style="margin-top:29px"><h2>${t('pondOverview')}</h2></div><div class="pond-grid">${state.ponds.map(pondCard).join('')}</div>`;}
function selectedLogs(p){return [...p.logs].sort((a,b)=>a.date.localeCompare(b.date)).slice(-chartDays);}
function renderAnalytics(){const p=state.ponds.find(x=>x.id===selectedPond)||state.ponds[0];selectedPond=p.id;const logs=selectedLogs(p),w=weight(p),g=regression(p),avgOx=logs.reduce((a,l)=>a+l.oxygen,0)/(logs.length||1);const good=logs.filter(l=>!assess(p,l).notes.length).length;
  return `${header('analyticsTitle','analyticsSub',`<select class="field-select" data-control="pond">${pondOptions()}</select>`)}<div class="section-top"><h2>${esc(p.name)} · ${esc(SPECIES[p.species]?.[lang]||p.species)}</h2><div class="segmented"><button class="segment ${chartDays===14?'active':''}" data-action="days" data-days="14">${t('days14')}</button><button class="segment ${chartDays===30?'active':''}" data-action="days" data-days="30">${t('days30')}</button></div></div><div class="analytics-layout"><div style="display:flex;flex-direction:column;gap:18px"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">${t('oxygenTrend')}</h2><div class="panel-sub">${nf(avgOx,1)} mg/L</div></div>${badge(p)}</div><div class="chart-box">${lineSVG(logs,'oxygen','oxygen','#6cb8fd')}</div>${axisDates(logs)}</div><div class="panel"><div class="panel-head"><div><h2 class="panel-title">${t('tempTrend')}</h2><div class="panel-sub">${nf(latest(p).temp,1)} °C</div></div></div><div class="chart-box">${lineSVG(logs,'temp','temp','#f9cb79')}</div>${axisDates(logs)}</div></div><div class="panel"><h2 class="panel-title">${t('summary')}</h2><div class="metric-row"><span>${t('recentWeight')}</span><strong>${nf(w,1)} g</strong></div><div class="metric-row"><span>${t('dailyGrowth')}</span><strong>${nf(g,2)} g / ${t('days')}</strong></div><div class="metric-row"><span>${t('avgOxygen')}</span><strong>${nf(avgOx,1)} mg/L</strong></div><div class="metric-row"><span>${t('compliance')}</span><strong>${nf(good)}/${nf(logs.length)} ${t('samples')}</strong></div><div class="metric-row"><span>pH</span><strong>${nf(latest(p).ph,1)}</strong></div><div class="info-box">${t('trendNote')}</div><div style="margin-top:16px"><button class="btn primary" data-action="addLog" data-id="${esc(p.id)}">${t('newLog')}</button></div></div></div>`;
}
function forecastCalc(p){const w=weight(p),growth=regression(p),target=forecast.target,days=target<=w?0:growth>0?Math.ceil((target-w)/growth):null;
  const mass=p.count*target/1000;
  const revenue=mass*forecast.price;
  const addedKg=p.count*Math.max(0,target-w)/1000;
  const feedKg=addedKg*forecast.fcr;
  const feedMoney=feedKg*forecast.feedCost;
  return {days,mass,revenue,feedKg,feedMoney,margin:revenue-feedMoney,growth};
}
function renderForecast(){const p=state.ponds.find(x=>x.id===selectedPond)||state.ponds[0];selectedPond=p.id;const species=SPECIES[p.species]||SPECIES.carp;
  if(!forecast.target||!Number.isFinite(forecast.target))forecast.target=species.target;
  const r=forecastCalc(p);
  const range=(label,id,min,max,step,val,display)=>`<div class="range-label"><span>${label}</span><strong id="val-${id}">${display(val)}</strong></div><input type="range" id="range-${id}" data-range="${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${label}">`;
  return `${header('forecastTitle','forecastSub')}<div class="forecast-grid"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">${t('forecastInputs')}</h2><div class="panel-sub">${t('trendNote')}</div></div></div><div class="form-field"><label>${t('pond')}</label><select class="field-select" data-control="pond" style="max-width:100%">${pondOptions()}</select></div><div style="margin-top:25px">${range(t('sellingPrice'),'price',1000,10000,100,forecast.price,v=>nf(v)+' ₸')}${range(t('feedCost'),'feedCost',100,1500,10,forecast.feedCost,v=>nf(v)+' ₸')}${range(t('fcr'),'fcr',1,3,0.1,forecast.fcr,v=>nf(v,1))}${range(t('targetWeight'),'target',200,2500,50,forecast.target,v=>nf(v)+' g')}</div><div class="info-box">${t('forecastWarning')}</div></div><div class="forecast-result" id="forecastResult">${forecastResultHTML(r,p)}</div></div>`;
}
function forecastResultHTML(r,p){const date=r.days==null?'—':r.days===0?t('goalReached'):`${nf(r.days)} ${t('days')}`;
  const stamp=r.days!=null&&r.days>0?`${t('forecastDate')}: ${dateDisplay(addDays(shiftDate(0),r.days))}`:r.days===0?'':t('insufficient');
  return `<div class="eyebrow">${t('forecastOutput')}</div><div style="margin-top:20px;color:#a9d3d0;font-size:12px">${t('harvestDate')}</div><div class="forecast-figure">${date}</div><div style="font-size:12px;color:#9fc9c9">${stamp}</div><div class="forecast-kpis"><div><label>${t('harvestMass')}</label><strong>${nf(r.mass/1000,2)} t</strong></div><div><label>${t('expectedRevenue')}</label><strong>${nf(r.revenue)} ₸</strong></div><div><label>${t('feedNeeded')}</label><strong>${nf(r.feedMoney)} ₸</strong><div class="small-muted">${nf(r.feedKg)} kg</div></div><div><label>${t('margin')}</label><strong>${nf(r.margin)} ₸</strong></div></div><div class="info-box"><strong>${t('marginNote')}</strong></div>`;
}
const englishPitch='My project is AquaMind, an offline-first web application for small fish farms. It helps farmers record pond data, monitor water quality, track fish growth, and estimate a future harvest. I built the interface with HTML, CSS, and JavaScript. Data is stored locally in the browser. For the forecast, I used a simple linear regression on past weight measurements. This prototype currently uses sample or manual data, not real sensors. My next goal is to connect ESP32 sensors, build a secure backend, and validate the forecasting model with real measurements.';
function renderProject(){return `${header('projectTitle','projectSub',`<button class="btn ghost" data-action="reset">↺ ${t('reset')}</button>`)}<section class="hero"><div class="hero-copy"><div class="hero-label">PORTFOLIO CASE STUDY • AQUAMIND</div><h2>${t('projectWhy')}</h2><p>${t('projectWhyDesc')}</p></div><div class="hero-graphic">${heroFish()}</div></section><div class="project-grid"><div class="panel"><h2 class="panel-title">${t('projectFeatures')}</h2>${[1,2,3,4].map((n)=>`<div class="feature-item"><div class="feature-icon">${['','▣','≋','↗','⇩'][n]}</div><div><strong>${t('feat'+n)}</strong><p>${t('feat'+n+'d')}</p></div></div>`).join('')}</div><div class="panel"><h2 class="panel-title">${t('techStack')}</h2><div class="stack-tags"><span>HTML5</span><span>CSS3</span><span>JavaScript ES6+</span><span>localStorage</span><span>SVG</span><span>CSV</span><span>Linear Regression</span></div><h2 class="panel-title" style="margin-top:28px">${t('howItWorks')}</h2><ol class="step-list">${[1,2,3,4].map(i=>`<li>${t('step'+i)}</li>`).join('')}</ol></div><div class="panel"><h2 class="panel-title">${t('nextSteps')}</h2><ol class="step-list">${[1,2,3,4].map(i=>`<li>${t('roadmap'+i)}</li>`).join('')}</ol><div class="info-box"><strong>${t('limitationTitle')}</strong><div style="margin-top:5px">${t('limitation')}</div></div></div><div class="panel"><div class="panel-head"><h2 class="panel-title">${t('pitchTitle')}</h2><button class="btn small ghost" data-action="copy">⧉ ${t('copyPitch')}</button></div><div class="pitch">${englishPitch}</div><p class="footnote">This project demonstrates front-end engineering, structured data handling, data visualization and a transparent forecasting algorithm.</p></div></div>`;}
const renderers={overview:renderOverview,ponds:renderPonds,analytics:renderAnalytics,forecast:renderForecast,project:renderProject};
function render(){
  if(!state.ponds.some(p=>p.id===selectedPond))selectedPond=state.ponds[0].id;
  byId('content').innerHTML=renderers[view]();
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.view===view));
  document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));
  byId('breadcrumbPage').textContent=t('nav'+view.charAt(0).toUpperCase()+view.slice(1)).toUpperCase();
  byId('todayLabel').textContent=new Date().toLocaleDateString(lang==='kk'?'kk-KZ':'en-US',{day:'numeric',month:'long',year:'numeric'});
  byId('year').textContent=new Date().getFullYear();
  byId('langKk').classList.toggle('active',lang==='kk');byId('langEn').classList.toggle('active',lang==='en');
  document.documentElement.lang=lang;
}
function navigate(v){if(!renderers[v])return;view=v;byId('sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'});}
let toastTimer;
function toast(message){const el=byId('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000);}
function closeModal(){byId('modalRoot').innerHTML='';}
function modal(title,fields,submitText,kind,pondId=''){byId('modalRoot').innerHTML=`<div class="modal-shade" id="modalShade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-header"><h2 id="modalTitle">${title}</h2><button class="close" data-action="closeModal" aria-label="Close">×</button></div><form id="entryForm" data-kind="${kind}" data-id="${esc(pondId)}"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn ghost" data-action="closeModal">${t('cancel')}</button><button type="submit" class="btn primary">${submitText}</button></div></form></div></div>`;const first=byId('entryForm').querySelector('input');first?.focus();}
function field(key,name,type,val,min,max,step,span='',extra=''){return `<div class="form-field ${span}"><label for="f-${name}">${t(key)}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(val)}" ${min!==''?`min="${min}"`:''} ${max!==''?`max="${max}"`:''} ${step!==''?`step="${step}"`:''} ${extra} required></div>`;}
function openNewPond(){const fields=field('pondName','name','text','', '', '', '', 'span','maxlength="60" placeholder="Pond D"')+`<div class="form-field"><label for="f-species">${t('species')}</label><select id="f-species" name="species" required>${Object.entries(SPECIES).map(([key,item])=>`<option value="${key}">${esc(item[lang])}</option>`).join('')}</select></div>`+field('fishNumber','count','number',1000,1,10000000,1)+field('area','area','number',1000,1,100000000,1)+field('initialWeight','weight','number',200,1,100000,0.1);modal(t('addPondTitle'),fields,t('create'),'pond');}
function openNewLog(pId=selectedPond){const p=state.ponds.find(x=>x.id===pId)||state.ponds[0];const l=latest(p)||{temp:24,oxygen:6,ph:7.2,weight:200};
  const fields=`<div class="form-field span"><label>${t('pond')}</label><select name="pond" required>${pondOptions(p.id)}</select></div>`+field('date','date','date',shiftDate(0),'','','','')+field('avgFishWeight','weight','number',l.weight,1,100000,0.1)+field('temperature','temp','number',l.temp,-5,50,0.1)+field('dissolvedOxygen','oxygen','number',l.oxygen,0,30,0.1)+field('ph','ph','number',l.ph,0,14,0.1);
  modal(t('measurementTitle'),fields,t('save'),'log',p.id);
}
function handleSubmit(event){event.preventDefault();const form=event.target;const data=new FormData(form);if(form.dataset.kind==='pond'){
    const name=String(data.get('name')||'').trim(),species=String(data.get('species'));
    const count=Number(data.get('count')),area=Number(data.get('area')),w=Number(data.get('weight'));
    if(!name||!SPECIES[species]||!(count>0&&Number.isInteger(count))||!(area>0)||!(w>0)||!Number.isFinite(w)){toast(t('validation'));return;}
    const id='p'+Date.now();const temp=species==='trout'?15:25;state.ponds.push({id,name,species,count,area,logs:[{date:shiftDate(0),temp,oxygen:6.5,ph:7.2,weight:w}]});selectedPond=id;persist();closeModal();render();toast(t('added'));return;
  }
  if(form.dataset.kind==='log'){
    const pondId=String(data.get('pond')),p=state.ponds.find(x=>x.id===pondId);
    const date=String(data.get('date')||''),weight=Number(data.get('weight')),temp=Number(data.get('temp')),oxygen=Number(data.get('oxygen')),ph=Number(data.get('ph'));
    if(!p||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime())||!(weight>0&&weight<=100000)||!(temp>=-5&&temp<=50)||!(oxygen>=0&&oxygen<=30)||!(ph>=0&&ph<=14)){toast(t('validation'));return;}
    p.logs=p.logs.filter(l=>l.date!==date);p.logs.push({date,weight,temp,oxygen,ph});p.logs.sort((a,b)=>a.date.localeCompare(b.date));selectedPond=p.id;persist();closeModal();render();toast(t('saved'));
  }
}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const csvCell=v=>'"'+String(v).replaceAll('"','""')+'"';const rows=[['pond','species','fish_count','area_m2','date','avg_weight_g','water_temp_c','oxygen_mg_l','ph'],...state.ponds.flatMap(p=>p.logs.map(l=>[p.name,p.species,p.count,p.area,l.date,l.weight,l.temp,l.oxygen,l.ph]))];downloadFile('aquamind-data-'+shiftDate(0)+'.csv','\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast(t('exported'));}
async function copyPitch(){try{await navigator.clipboard.writeText(englishPitch);}catch(e){const el=document.createElement('textarea');el.value=englishPitch;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();}toast(t('copied'));}
function handleClick(event){const action=event.target.closest('[data-action]');const nav=event.target.closest('[data-view]');if(nav){navigate(nav.dataset.view);return;}if(!action){if(event.target.id==='modalShade')closeModal();return;}
  const type=action.dataset.action;
  if(type==='export')exportCSV();
  else if(type==='addPond')openNewPond();
  else if(type==='addLog')openNewLog(action.dataset.id||selectedPond);
  else if(type==='openPond'){selectedPond=action.dataset.id;navigate('analytics');}
  else if(type==='days'){chartDays=Number(action.dataset.days);render();}
  else if(type==='closeModal')closeModal();
  else if(type==='copy')copyPitch();
  else if(type==='reset'&&window.confirm(t('resetConfirm'))){state=seed();selectedPond='p1';forecast={price:3500,feedCost:390,fcr:1.6,target:900};persist();navigate('overview');toast(t('resetDone'));}
}
function handleChange(event){const control=event.target.dataset.control;if(control==='pond'){selectedPond=event.target.value;if(view==='forecast')forecast.target=SPECIES[state.ponds.find(p=>p.id===selectedPond).species].target;render();}}
function handleInput(event){const id=event.target.dataset.range;if(!id||!(id in forecast))return;forecast[id]=Number(event.target.value);const format=id==='fcr'?nf(forecast[id],1):nf(forecast[id])+(id==='target'?' g':' ₸');byId('val-'+id).textContent=format;const p=state.ponds.find(x=>x.id===selectedPond);byId('forecastResult').innerHTML=forecastResultHTML(forecastCalc(p),p);}
function init(){state=load();if(!state.ponds.length)state=seed();selectedPond=state.ponds[0].id;document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleInput);document.addEventListener('submit',e=>{if(e.target.id==='entryForm')handleSubmit(e);});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});byId('langKk').onclick=()=>{lang='kk';localStorage.setItem(LANG_KEY,lang);render();};byId('langEn').onclick=()=>{lang='en';localStorage.setItem(LANG_KEY,lang);render();};byId('mobileMenu').onclick=()=>byId('sidebar').classList.toggle('open');render();}
init();

</script>
</body>
</html>
